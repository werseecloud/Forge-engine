[package]
name = "forge_ai"
version = "1.0.0"
edition = "2021"

[features]
default = []
llama_cpp = []
candle = []
cloud_api = []

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
walkdir = "2"
