[package]
name = "forge_tools"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "forge_tools"
path = "src/main.rs"

[features]
default = []
editor = []
webgpu = []
vulkan = []
dx12 = []
metal = []
raytracing = []
pathtracing = []
mobile = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
forge_rhi = { path = "../forge_rhi" }
serde_json = "1"
