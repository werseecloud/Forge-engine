[package]
name = "forge_installer"
version = "1.0.0"
description = "Forge Engine desktop editor"
authors = ["Wersee Developers"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "forge_installer_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
winreg = "0.55"
zip = { version = "2", default-features = false, features = ["deflate"] }
forge_process = { path = "../crates/forge_process" }
forge_settings = { path = "../crates/forge_settings" }
forge_assets = { path = "../crates/forge_assets" }
forge_rhi = { path = "../crates/forge_rhi", features = ["dx12", "vulkan", "metal"] }
forge_renderer = { path = "../crates/forge_renderer" }
forge_raytracing = { path = "../crates/forge_raytracing" }
forge_editor_bridge = { path = "../crates/forge_editor_bridge" }
forge_ai = { path = "../crates/forge_ai" }
