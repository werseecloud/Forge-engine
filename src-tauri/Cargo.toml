[package]
name = "forge_engine_editor"
version = "1.0.0"
description = "Forge Engine desktop editor"
authors = ["WerseeCloud"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "forge_engine_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

